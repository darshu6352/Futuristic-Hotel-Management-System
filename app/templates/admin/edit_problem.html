<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Document</title>
</head>
<body>
<div class="container">
    <div class="card  border border-dark mx-auto p-4 mt-4 text-center" style="max-width: 600px;">
    <h1 class="mb-4">Make changes </h1>
          <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="mt-2">
            <label>name :</label>
            <input type="text" placeholder="name" name="name"
            value="{{ problem.name }}">
        </div>
        <div class="mt-3">
            <div class="row">
                <div class="col"  style="margin-right:-80px;">
                    <label>Solution :</label>
                </div>
                <div class="col" style="margin-left:-60px;">
                    <textarea name="solution" class="form-control" rows="5">{{ problem.solution }}</textarea>                    
                </div>
            </div>
        </div>
        <div class="mt-3">
                <label>Information :</label>
                <input type="text" placeholder="Information" name="Information"
                        value="{{ problem.Information }}">
        </div>
        <div class="mt-3">
            <div class="row">
                <div class="col" style="margin-left: 100px;">
                    <input type="file" name="img">
                </div>
                <div class="col"style="margin-left: -120px;">
                    <label>Current Image :</label><br>
                    {% if problem.img %}
                    <img src="{{ problem.img.url }}"
                    width="200"
                    class="img-thumbnail mb-2">
                    {% endif %}
                </div>
            </div>
        </div>
        <div class="my-4">
            <button type="submit">Submit</button>
        </div>
    </form>
    </div>

</div>
</body>
</html>
