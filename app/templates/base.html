{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        /* ============================= */
        /* GLASSY NAVBAR */
        /* ============================= */
        .nav {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            border-radius: 30px;
            background: rgba(66, 32, 32, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(252, 211, 211, 0.35);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15), inset 0 1px 0 rgba(224, 211, 211, 0.35);
            z-index: 9999;
            transition: 0.3s ease;
        }

        .nav:hover {
            background: rgba(143, 219, 42, 0.25);
        }

        .nav .container-fluid {
            margin: 0 !important;
            padding: 8px 12px;
        }

        .nav .container {
            align-items: center;
        }

        /* Navbar Links Container */
        .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            justify-content: space-evenly;
        }

        /* Navbar Links */
        .nav a {
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 25px;
            transition: 0.3s ease;
        }

        .nav a:hover {
            color: #222;
            background: rgba(255, 255, 255, 0.80);
            transform: translateY(-2px);
        }

        /* Mobile Toggle Button (Default hidden on desktop) */
        .menu-toggle-btn {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
        }

        /* ============================= */
        /* MOBILE SCREEN OPTIMIZATION */
        /* ============================= */
        @media (max-width: 768px) {
            .nav {
                width: 95%;
                top: 10px;
                border-radius: 20px;
            }

            .nav .container {
                flex-direction: column;
                align-items: stretch;
            }

            /* Mobile header row jisme sirf button/logo rahega */
            .mobile-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
            }

            .menu-toggle-btn {
                display: block; /* Mobile par button dikhega */
            }

            /* Links by default mobile par chhupe rahenge */
            .nav-links {
                display: none;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                padding-top: 15px;
                padding-bottom: 10px;
                width: 100%;
            }

            /* Jab JS se 'active' class add hogi tab menu khul jayega */
            .nav-links.active {
                display: flex;
            }

            .nav a {
                font-size: 14px;
                padding: 6px 12px;
                width: 100%;
                text-align: center;
            }
        }
    </style>

    <title>{% block title %}My Web App{% endblock %}</title>
</head>

<body class="light-mode">

    <!-- ============================= -->
    <!-- NAVBAR -->
    <!-- ============================= -->
    <div class="nav fixed-top">
        <div class="container-fluid">
            <div class="container d-flex flex-column">
                
                <!-- Mobile Header (Button yahan rahega) -->
                <div class="mobile-header">
                    <span class="text-white fw-bold" style="font-size: 16px;"></span> <!-- Aap yahan chhota logo bhi rakh sakte hain -->
                    <button class="menu-toggle-btn" id="menuBtn">☰</button>
                </div>

                <!-- Yeh saare links aur switch mobile par button dabane par khulenge -->
                <div class="nav-links" id="navLinks">
                    <a href="/">Home</a>
                    <a href="/RoomsBook/">Rooms</a>
                    <a href="/car_service/">Services</a>
                    <a href="/problems/">Problems</a>

                    <!-- Dark / Light Mode Switch -->
                    <label class="switch">
                        <input type="checkbox" id="modeToggle">
                        <span class="slider round"></span>
                    </label>
                </div>

            </div>
        </div>
    </div>

    <!-- ============================= -->
    <!-- PAGE CONTENT -->
    <!-- ============================= -->
    {% block body %}
    {% endblock %}

    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->
    {% include 'footer.html' %}

    <!-- ============================= -->
    <!-- JAVASCRIPT -->
    <!-- ============================= -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Mobile Menu Toggle Script
        const menuBtn = document.getElementById('menuBtn');
        const navLinks = document.getElementById('navLinks');

        menuBtn.addEventListener('click', () => {
            navLinks.classList.toggle('active');
            // Button ka icon change karne ke liye (☰ se ✕)
            if (navLinks.classList.contains('active')) {
                menuBtn.innerHTML = '✕';
            } else {
                menuBtn.innerHTML = '☰';
            }
        });
    </script>
    <script src="{% static 'js/script.js' %}"></script>

</body>
</html>
